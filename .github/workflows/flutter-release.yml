name: Build APK ZeroRisco

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da versão (ex: v1.0.0)'
        required: false

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verificar versão do Flutter
        run: flutter --version

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        continue-on-error: true

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Build APK (release)
        run: flutter build apk --release
        continue-on-error: true

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: zerorisco-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerorisco-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Criar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ZeroRisco ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## 📱 ZeroRisco — Nova versão

            **Para instalar o APK no Android:**
            1. Baixe o arquivo `app-debug.apk` abaixo
            2. Nas configurações do celular, ative **"Fontes desconhecidas"** ou **"Instalar apps desconhecidos"**
            3. Abra o arquivo baixado e confirme a instalação

            > Backend: https://saquadrive.onrender.com
          files: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
