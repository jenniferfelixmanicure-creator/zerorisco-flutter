name: zerorisco
description: App de transporte seguro em Saquarema, RJ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # HTTP
  http: ^1.2.2

  # Storage
  flutter_secure_storage: ^9.2.2

  # Socket.io
  socket_io_client: ^2.0.3+1

  # Mapas (OpenStreetMap, sem API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Localização
  geolocator: ^12.0.0

  # Permissões
  permission_handler: ^11.3.1

  # Imagem
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Links externos (ligações, URLs)
  url_launcher: ^6.3.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
